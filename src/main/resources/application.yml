spring:
  application:
    name: backend
  datasource:
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    url: ${DB_URL}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true #disable in production
    properties:
        hibernate:
            format_sql: true
            dialect: org.hibernate.dialect.PostgreSQLDialect
scalar:
  enabled: true
  url: /v3/api-docs
  path: /scalar
  theme: saturn
springdoc:
  api-docs:
    path: /v3/api-docs

security:
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:900000}
    refresh-token-expiration: ${REFRESH_TOKEN_EXPIRATION:604800000}
  cookie:
    secure: ${COOKIE_SECURE:false}
    same-site: ${COOKIE_SAME_SITE:Lax}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    login-account-limit: ${RATE_LIMIT_LOGIN_ACCOUNT:5}
    login-ip-limit: ${RATE_LIMIT_LOGIN_IP:150}
    refresh-token-limit: ${RATE_LIMIT_REFRESH_TOKEN:15}
    refresh-ip-limit: ${RATE_LIMIT_REFRESH_IP:300}
    register-ip-limit: ${RATE_LIMIT_REGISTER_IP:60}
    password-reset-ip-limit: ${RATE_LIMIT_PASSWORD_RESET_IP:30}
    window-millis: ${RATE_LIMIT_WINDOW_MILLIS:60000}
  cors:
    allowed-origins: ${ALLOWED_ORIGINS}
resend:
  api-key: ${RESEND_API_KEY}
  from-email: ${RESEND_FROM_EMAIL}
password-reset:
  pepper: ${PASSWORD_RESET_PEPPER}
cloudinary:
  url: ${CLOUDINARY_URL:}
