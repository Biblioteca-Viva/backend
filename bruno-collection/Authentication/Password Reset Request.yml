settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Solicitar codigo de redefinicao

  Retorna sempre `202` para email inexistente, conta inativa, cooldown ativo ou envio concluido.
  Somente contas `ACTIVE` recebem o codigo de 8 digitos. Um novo envio so ocorre depois de 60 segundos.

  ## Cenarios manuais
  - Conta ativa: recebe o codigo pelo Resend.
  - Conta pendente, bloqueada ou rejeitada: retorna `202`, sem enviar email.
  - Email inexistente: retorna a mesma resposta `202`.
  - Falha do Resend: retorna `502`.
