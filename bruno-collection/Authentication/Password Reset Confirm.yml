info:
  name: Password Reset - Confirm
  type: http
  seq: 8

http:
  method: POST
  url: "{{api_url}}auth/password-reset/confirm"
  body:
    type: json
    data: |-
      {
        "resetToken": "{{password_reset_token}}",
        "newPassword": "nova-senha-123"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Confirmar nova senha

  Usa o token temporario salvo pela etapa de verificacao. Retorna `204` quando a senha for alterada.

  ## Cenarios manuais
  - Token valido e conta ativa: troca a senha e invalida JWTs anteriores.
  - Token expirado, reutilizado ou conta inativa: retorna `400`.
