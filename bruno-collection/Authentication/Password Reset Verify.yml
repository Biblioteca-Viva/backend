info:
  name: Password Reset - Verify Code
  type: http
  seq: 7

http:
  method: POST
  url: "{{api_url}}auth/password-reset/verify"
  body:
    type: json
    data: |-
      {
        "email": "aluno1@teste.com",
        "code": "01234567"
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() === 200) {
          const data = res.getBody();
          bru.setGlobalEnvVar("password_reset_token", data.resetToken);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Validar codigo

  Substitua `code` pelo codigo recebido por email. Quando valido, salva o token temporario em `password_reset_token`.

  ## Cenarios manuais
  - Codigo correto em ate 10 minutos: retorna `200` e token valido por 5 minutos.
  - Codigo incorreto, expirado, reutilizado ou conta inativa: retorna `400`.
  - Depois de 5 erros, o codigo permanece bloqueado ate uma nova solicitacao.
