info:
  name: getById
  type: http
  seq: 3

http:
  method: GET
  url: "{{api_url}}news/{{id}}"
  auth: inherit

runtime:
  variables:
    - name: id
      value: "{{news_id}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Buscar Notícia por ID

  Recupera os detalhes de uma notícia pelo seu ID (UUID).
  Público, não requer autenticação.

  ## Parâmetros
  - `id` (path variable): UUID da notícia.

  ## Respostas Esperadas
  - `200`: Notícia encontrada com sucesso (`NewsResponseDTO`).
  - `404`: Notícia não encontrada.
