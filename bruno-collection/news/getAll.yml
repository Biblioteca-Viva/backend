info:
  name: getAll
  type: http
  seq: 2

http:
  method: GET
  url: "{{api_url}}news"
  params:
    - name: page
      value: "0"
      type: query
    - name: size
      value: "10"
      type: query
    - name: sort
      value: "createdAt,desc"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Listar Notícias

  Lista paginada de todas as notícias.
  Público, não requer autenticação.

  ## Parâmetros de Paginação e Ordenação
  - `page`: Número da página (inicia em 0). Padrão: 0.
  - `size`: Quantidade de registros por página. Padrão: 10.
  - `sort`: Campo e direção de ordenação (ex: `createdAt,desc`). Padrão: `createdAt,desc`.

  ## Respostas Esperadas
  - `200`: Lista paginada retornada com sucesso (`Page<NewsResponseDTO>`).
