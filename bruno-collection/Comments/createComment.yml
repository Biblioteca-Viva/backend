info:
  name: createComment
  type: http
  seq: 1

http:
  method: POST
  url: "{{api_url}}work/{{work_id}}/comments"
  body:
    type: json
    data: |-
      {
        "content": "Ótima obra! Gostei muito da abordagem."
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Create Comment

  Cria um comentario na obra indicada por `work_id`.

  ## Regras
  - Requer `Authorization: Bearer <token>` de `ALUNO`, `CURADOR` ou `ADMIN`.
  - `content` e obrigatorio e nao pode estar em branco.
  - O comentario criado retorna o campo `reply` como `null`.

  ## Respostas esperadas
  - `201`: comentario criado.
  - `400`: conteudo invalido.
  - `401`: usuario nao autenticado.
  - `404`: obra nao encontrada.
