info:
  name: deleteComment
  type: http
  seq: 4

http:
  method: DELETE
  url: "{{api_url}}work/{{work_id}}/comments/{{comment_id}}"
  auth: inherit

runtime:
  variables:
    - name: work_id
      value: 88888888-8888-8888-8888-888888888003
    - name: comment_id
      value: c8000003-0000-0000-0000-000000000001

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Delete Comment

  Exclui um comentario. Para excluir uma resposta, use a rota da pasta `reply`.

  ## Regras
  - Requer `Authorization: Bearer <token>`.
  - Os IDs iniciais apontam para registros do seed local.
  - Somente o autor do comentario ou um usuario `ADMIN` pode excluir.
  - Excluir um comentario tambem exclui a resposta vinculada a ele.

  ## Respostas esperadas
  - `204`: comentario excluido.
  - `401`: usuario nao autenticado.
  - `403`: usuario autenticado sem permissao sobre o comentario.
  - `404`: comentario nao encontrado.
