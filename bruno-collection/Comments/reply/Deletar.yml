info:
  name: Deletar
  type: http
  seq: 3

http:
  method: DELETE
  url: "{{api_url}}work/{{work_id}}/comments/{{commentId}}/reply/{{id}}"
  auth: inherit

runtime:
  variables:
    - name: commentId
      value: c9000003-0000-0000-0000-000000000002
    - name: id
      value: a94495f8-149b-49dd-a4b6-e93c26bd3f97

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Delete Comment Reply

  Exclui a resposta identificada por `id`.

  ## Regras
  - Requer `Authorization: Bearer <token>`.
  - Somente o autor da resposta ou um `ADMIN` pode excluir.

  ## Respostas esperadas
  - `204`: resposta excluida.
  - `401`: usuario nao autenticado.
  - `403`: usuario sem permissao.
  - `404`: resposta nao encontrada.
