info:
  name: editReply
  type: http
  seq: 4

http:
  method: PUT
  url: "{{api_url}}work/{{work_id}}/comments/{{commentId}}/reply"
  body:
    type: json
    data: |-
      {
        "content": "valeu tamo junto"
      }
  auth: inherit

runtime:
  variables:
    - name: commentId
      value: 3efb6f77-923e-4a62-9843-e7b8dd8e02d9
    - name: id
      value: 96e5e2a8-228d-4d78-9cd8-1b92d41acd1a

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Edit Comment Reply

  Edita a resposta vinculada ao comentario indicado por `commentId`.

  ## Regras
  - Requer `Authorization: Bearer <token>`.
  - Somente o autor da resposta ou um `ADMIN` pode editar.
  - `content` e obrigatorio e aceita no maximo 200 caracteres.

  ## Respostas esperadas
  - `200`: resposta atualizada.
  - `400`: conteudo invalido.
  - `401`: usuario nao autenticado.
  - `403`: usuario sem permissao.
  - `404`: resposta nao encontrada.
