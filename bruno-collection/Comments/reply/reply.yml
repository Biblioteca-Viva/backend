info:
  name: reply
  type: http
  seq: 1

http:
  method: POST
  url: "{{api_url}}work/{{work_id}}/comments/{{commentId}}/reply"
  body:
    type: json
    data: |-
      {
        "content": "valeu!"
      }
  auth: inherit

runtime:
  variables:
    - name: commentId
      value: 607f16dd-a09b-4265-8525-009057c1e85f

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Create Comment Reply

  Cria a unica resposta permitida para o comentario indicado por `commentId`.

  ## Regras
  - Requer `Authorization: Bearer <token>`.
  - Um `ADMIN` pode responder qualquer comentario.
  - O usuario vinculado como autor da obra pode responder, incluindo um `ALUNO`.
  - Outros usuarios recebem `403`.
  - `content` e obrigatorio e aceita no maximo 200 caracteres.
  - Se o comentario ja possuir uma resposta, retorna `409`.

  ## Respostas esperadas
  - `201`: resposta criada.
  - `400`: conteudo invalido.
  - `409`: o comentario ja possui uma resposta.
  - `401`: usuario nao autenticado.
  - `403`: usuario sem permissao para responder.
  - `404`: comentario nao encontrado.
