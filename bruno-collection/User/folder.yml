docs: |-
  # User

  Endpoints de consulta de usuarios fora do painel administrativo.

  ## Endpoints
  - `GET /user`: lista usuarios com paginacao e filtro opcional por `status`.
  - `GET /user/find-by-email?email={email}`: busca um usuario por email.

  As consultas exigem token Bearer de usuario `ADMIN` ou `CURADOR` e nao permitem
  aprovar, rejeitar, bloquear ou excluir contas.
