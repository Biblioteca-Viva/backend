docs: |-
  # Create Other

  Cria uma obra da categoria geral, para o que nao se encaixa nas demais
  categorias. Requer usuario autenticado com perfil `ADMIN` ou `CURADOR`.

  ## Campos opcionais
  Diferente dos outros tipos, `url` e `imageUrl` sao opcionais. Ambos aceitam
  a chave omitida ou string vazia; um endereco invalido retorna `400`.
  Quando informado, o `imageUrl` e usado como miniatura na listagem e na home.

  ## Regras importantes
  - `authorEmail` deve apontar para um usuario cadastrado.
  - O mesmo autor nao pode ter duas obras com o mesmo `title`.
  - O banco precisa ter a migration `2026-08-25-add-other-work-type.sql`
    aplicada, senao o insert falha na constraint `obras_type_check`.

  ## Respostas esperadas
  - `201`: obra criada, com `"type": "Other"`.
  - `400`: `url` ou `imageUrl` com endereco invalido.
  - `404`: autor nao encontrado.
  - `409`: ja existe obra com o mesmo autor e titulo.
