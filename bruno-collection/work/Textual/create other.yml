docs: |-
  # Create Other

  Cria uma obra da categoria geral, para o que nao se encaixa nas demais
  categorias. Requer usuario autenticado com perfil `ADMIN` ou `CURADOR`.

  ## Formato da requisicao
  - Content-Type: `multipart/form-data`
  - Part `data` (`application/json`): dados da obra. Nao inclui campo `imageUrl`.
  - Part `image` (`file`): **opcional**. Arquivo enviado ao Cloudinary, que
    devolve a URL publica persistida em `imageUrl`. Formatos: `.jpg`, `.jpeg`, `.png`.

  ## Campos opcionais
  - `url`: link externo da obra. Aceita chave omitida ou string vazia; endereco
    invalido retorna `400`.
  - `image`: quando omitido, a obra fica sem imagem. No update, omitir o part
    mantem a imagem anterior.
  - Quando enviada, a imagem e usada como miniatura na listagem e na home.

  ## Regras importantes
  - `authorEmail` deve apontar para um usuario cadastrado.
  - O mesmo autor nao pode ter duas obras com o mesmo `title`.
  - O banco precisa ter a migration `2026-08-25-add-other-work-type.sql`
    aplicada, senao o insert falha na constraint `obras_type_check`.

  ## Respostas esperadas
  - `201`: obra criada, com `"type": "Other"`.
  - `400`: `url` invalida, imagem em formato nao permitido ou arquivo vazio.
  - `404`: autor nao encontrado.
  - `409`: ja existe obra com o mesmo autor e titulo.
