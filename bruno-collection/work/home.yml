info:
  name: home
  type: http
  seq: 3

http:
  method: GET
  url: "{{api_url}}work/home"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Dashboard da home

  Dados da tela inicial. Publico, nao requer autenticacao.

  Retorna um contador por categoria (`articleCount`, `cordelCount`,
  `otherCount`, ...), as 5 obras mais recentes de cada categoria em `works`,
  e as 5 mais curtidas em `mostLikedWorks`.
