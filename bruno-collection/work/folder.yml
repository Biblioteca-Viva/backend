docs: |-
  # Works

  Endpoints de obras.

  ## Regras gerais atualizadas
  - Criar obra requer usuario `ADMIN` ou `CURADOR`.
  - O mesmo autor nao pode cadastrar duas obras com o mesmo `title`.
  - Obra duplicada retorna `409`.
  - Likes de obras sao idempotentes: repetir o like nao duplica registro.
  - Cada categoria tem seu proprio endpoint de criacao (`/work/articles`,
    `/work/cordels`, ...). A categoria geral usa `/work/others`.
  - `/work/arts`, `/work/infographics` e `/work/others` usam
    `multipart/form-data`: part `data` (JSON) + part `image` (arquivo). A imagem
    vai para o Cloudinary; nao se envia URL de imagem.
