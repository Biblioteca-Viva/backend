  method: POST
  url: "{{api_url}}work/arts"
  body:
    type: multipart-form
    data:
      - name: data
        type: text
        value: |2-
            {
                "title": "Arte Digital Contemporânea",
                "authorEmail": null,
                "authorName": "Nome do Autor Externo",
                "publicationDate": "2026-03-30T11:45:00",
                "description": "Uma composição digital detalhada explorando linhas arquitetônicas e cores vibrantes.",
                "description": "Uma composição digital detalhada explorando linhas arquitetônicas e cores vibrantes.",
