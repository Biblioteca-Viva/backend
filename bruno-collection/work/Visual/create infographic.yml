http:
  method: POST
  url: "{{api_url}}work/infographics"
  body:
    type: multipart-form
    data:
      - name: data
        type: text
        value: |-
          {
            "title": "Mapa da Diversidade Literária: Brasil 2026",
            "authorEmail": "aluno1@teste.com",
            "publicationDate": "2026-03-30T11:41:00",
            "description": "Um infográfico interativo que visualiza a distribuição de gêneros literários mais lidos em cada região do país, com destaque para o crescimento da literatura periférica.",
            "studentClass": "Terceiro B"
          }
        contentType: application/json
      - name: image
        type: file
        value: ""
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  # Create Infographic (Infográfico)

  Cria uma obra visual do tipo Infográfico.
  Requer usuário autenticado com perfil `ADMIN` ou `CURADOR`.

  ## Formato da Requisição
  - Content-Type: `multipart/form-data`
  - Part `data` (`application/json`): JSON com os dados do infográfico (`title`, `authorEmail`, `publicationDate`, `description`, `studentClass`). Não inclui campo `url`.
  - Part `image` (`file`): Arquivo de imagem a ser enviado ao Cloudinary. Formatos permitidos: `.jpg`, `.jpeg`, `.png`.

  ## Regras Importantes
  - `authorEmail` deve apontar para um usuário cadastrado.
  - O mesmo autor não pode ter duas obras com o mesmo `title`.
  - O upload é realizado diretamente para o Cloudinary, que retorna a URL pública persistida no banco.

  ## Respostas Esperadas
  - `201`: Infográfico criado com sucesso (retorna JSON com a `url` gerada pelo Cloudinary).
  - `400`: Imagem ausente, formato inválido (apenas JPG/PNG), arquivo vazio ou campos inválidos.
  - `404`: Autor não encontrado.
  - `409`: Já existe obra com o mesmo título para este autor.
